plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'truehitbox'
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"truehitbox" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	// In-game tests in a separate "gametest" source set; they are not part of the mod jar.
	// Run with: gradlew runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "truehitbox-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Optional: the same client game test with extra mods loaded, to check compatibility with a mod set.
// Its run directory is kept between runs, so mod configs (e.g. Iris shader settings) can be put there first;
// put an eula.txt there too for the dedicated server part. Like runClientGameTest, it clears build/run/clientGameTest.
// Run with: gradlew runModSetGameTest -PextraMods=<folder with mod jars>
if (project.hasProperty("extraMods")) {
	def extraMods = file(project.property("extraMods")).absolutePath
	loom.runs.register("modSetGameTest") {
		inherit loom.runs.getByName("clientGameTest")
		configName = "Mod set game test"
		runDir "build/run/modSetGameTest"
		vmArg "-Dfabric.addMods=${extraMods}"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion, "loader_version": loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
